<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Radial Gradient for modern depth -->
    <radialGradient id="vipBgGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0066b2"/>
      <stop offset="100%" stop-color="#004c8c"/>
    </radialGradient>
    <filter id="vipDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring (White) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#ffffff" stroke-width="6" filter="url(#vipDropShadow)"/>
  
  <!-- Inner Subtle Accent Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Main Blue Circular Background -->
  <circle cx="100" cy="100" r="84" fill="url(#vipBgGrad)"/>

  <!-- Crown on top of 'i' -->
  <path d="M96,52 L100,43 L104,52 L109,46 L107,56 L93,56 L91,46 Z" fill="#ffd700" stroke="#ffffff" stroke-width="0.8"/>
  <circle cx="100" cy="42" r="1.5" fill="#ffffff"/>
  <circle cx="91" cy="45" r="1.2" fill="#ffffff"/>
  <circle cx="109" cy="45" r="1.2" fill="#ffffff"/>

  <!-- Text "VIP" -->
  <g fill="#ffffff" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-weight="900" text-anchor="middle">
    <!-- V -->
    <text x="64" y="102" font-size="52" letter-spacing="-1">V</text>
    <!-- I (stem) -->
    <text x="100" y="102" font-size="52">I</text>
    <!-- P -->
    <text x="136" y="102" font-size="52" letter-spacing="-1">P</text>
  </g>

  <!-- Divider Line -->
  <line x1="45" y1="112" x2="155" y2="112" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="100" cy="112" r="3.5" fill="#ffd700"/>

  <!-- Hindi Text "पार्टी" -->
  <text x="100" y="148" fill="#ffffff" font-family="'Noto Sans Devanagari', 'Tiro Devanagari Hindi', 'Poppins', sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="1">
    पार्टी
  </text>
</svg>
