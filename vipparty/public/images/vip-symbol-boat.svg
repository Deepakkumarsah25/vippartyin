<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="boatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066b2"/>
      <stop offset="100%" stop-color="#003566"/>
    </linearGradient>
    <linearGradient id="sailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f37021"/>
      <stop offset="100%" stop-color="#d90429"/>
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0099ff"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
  </defs>

  <!-- Water Waves Base -->
  <path d="M15,155 Q45,145 75,155 T135,155 T185,155 L185,175 L15,175 Z" fill="url(#waterGrad)" opacity="0.3"/>
  <path d="M10,162 Q40,152 70,162 T130,162 T190,162 L190,180 L10,180 Z" fill="url(#waterGrad)" opacity="0.8"/>

  <!-- Boat Hull (Traditional Wooden Boat / Naav) -->
  <path d="M25,138 Q50,165 100,165 Q150,165 175,138 L160,132 Q100,145 40,132 Z" fill="url(#boatGrad)"/>
  <!-- Boat rim highlight -->
  <path d="M25,138 Q100,148 175,138 L170,135 Q100,144 30,135 Z" fill="#ffd700"/>

  <!-- Mast / Pole -->
  <rect x="97" y="35" width="6" height="110" rx="3" fill="#4a5568"/>

  <!-- Main Triangular Sail (Saffron / Orange) -->
  <path d="M103,42 L165,120 L103,120 Z" fill="url(#sailGrad)"/>
  
  <!-- Jib / Front Sail -->
  <path d="M97,52 L45,120 L97,120 Z" fill="#0284c7" opacity="0.95"/>

  <!-- Top Pennant / Flag -->
  <path d="M103,36 L130,44 L103,50 Z" fill="#ffd700"/>
  
  <!-- Oar / Chappu -->
  <line x1="60" y1="125" x2="30" y2="165" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="28" cy="167" rx="8" ry="4" transform="rotate(-35 28 167)" fill="#b45309"/>
</svg>
